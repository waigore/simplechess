name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'package.json'
              - 'package-lock.json'
              - 'npm-shrinkwrap.json'
              - 'yarn.lock'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'vitest.config.*'
              - 'eslint.config.*'
              - '.eslintrc*'
              - 'index.html'
              - 'src/**'
              - 'public/**'
              - 'tests/**'
              - 'test/**'
              - '**/*.{ts,tsx,js,jsx,mjs,cjs,css,scss}'
              - '.github/workflows/ci.yml'

  ci:
    name: CI
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip non-code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No npm/code file changes; skipping app checks."

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: needs.changes.outputs.code == 'true' && hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true' && hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install dependencies (no lockfile)
        if: >-
          needs.changes.outputs.code == 'true'
          && hashFiles('package.json') != ''
          && hashFiles('package-lock.json') == ''
        run: npm install

      - name: Lint
        if: needs.changes.outputs.code == 'true' && hashFiles('package.json') != ''
        run: npm run lint --if-present

      # Coverage gate: test:coverage must fail below 80% (AGENTS.md / Vitest thresholds).
      # Prefer test:coverage; fall back to test only until that script exists.
      - name: Test with coverage
        if: needs.changes.outputs.code == 'true' && hashFiles('package.json') != ''
        run: |
          has_script() {
            node -e "const s=require('./package.json').scripts||{}; process.exit(s['$1']?0:1)"
          }
          if has_script test:coverage; then
            npm run test:coverage
          elif has_script test; then
            echo "Add a test:coverage script that fails below 80% coverage (AGENTS.md)."
            npm test
          else
            echo "No test or test:coverage script yet; skipping tests."
          fi

      - name: Build
        if: needs.changes.outputs.code == 'true' && hashFiles('package.json') != ''
        run: npm run build --if-present

      - name: No app package yet
        if: needs.changes.outputs.code == 'true' && hashFiles('package.json') == ''
        run: echo "No package.json yet; app checks will run once the project is scaffolded."
